<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="css/estilos.css">

<body>

<header>

            <div class="dropdown">

                    </span>

            </div>

    <section class="productos">
        <h1 id="titulo-coleccion">Nuestras Colecciones</h1>
        
        <div class="grid" id="productos" aria-live="polite">

<footer style="text-align:center; padding:40px 20px; border-top:1px solid rgba(255,255,255,0.05); margin-top:60px;">
    <p style="font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#777;">
        © 2026 Axis Bit — The Hidden Layer

</footer>

<script src="js/main.js" defer></script>
