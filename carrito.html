<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | Axis Bit</title>

    <meta name="description" content="Revisa los productos seleccionados y finaliza tu pedido en Axis Bit.">
    <meta name="theme-color" content="#1A1A1B">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="navbar">
        <a href="index.html" class="logo">AXIS BIT</a>
        <nav>
            <a href="index.html">Inicio</a>

            <div class="dropdown">
                <button type="button" class="dropbtn" onclick="toggleDropdown(event)" aria-haspopup="true" aria-expanded="false">
                    Colección ▾
                </button>

                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="productos.html?coleccion=marvel">Marvel Rivals</a>
                    <a href="productos.html?coleccion=elden">Elden Ring</a>
                    <a href="productos.html?coleccion=hollow">Hollow Knight</a>
                    <span class="proximamente" style="padding:15px 20px; font-size:11px; opacity:0.5; text-transform:uppercase;">
                        Próximamente
                    </span>
                </div>
            </div>

            <a href="carrito.html" class="cart-active" aria-label="Ver carrito">
                🛒 <span id="contador-carrito">0</span>
            </a>
        </nav>
    </div>
</header>

<main class="contenedor-carrito">
    <section class="productos">
        <h1>Tu Carrito</h1>

        <div id="lista-carrito" aria-live="polite">
            <p class="carrito-vacio">Cargando productos...</p>
        </div>

        <div id="resumen-carrito" class="resumen-compra">
            <div class="total-container">
                <span>Total a pagar:</span>
                <span id="total-precio">$0.00</span>
            </div>

            <div class="acciones-carrito">
                <button id="vaciar-carrito" class="btn-secundario" type="button">
                    Vaciar Carrito
                </button>

                <button id="finalizar-compra" class="btn" type="button">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </section>
</main>

<footer style="text-align:center; padding:40px 20px; border-top:1px solid rgba(255,255,255,0.05); margin-top:60px;">
    <p style="font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#777;">
        © 2026 Axis Bit — Todos los derechos reservados
    </p>
</footer>

<script src="js/main.js" defer></script>
<script src="js/carrito.js" defer></script>
</body>
</html>
